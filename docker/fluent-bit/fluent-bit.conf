[SERVICE]
    # Flush interval in seconds
    Flush        1
    Log_Level    info
    Daemon       off
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    # Read logs only from our gophprofile containers
    Path              /var/log/containers/gophprofile-*.log
    Parser            docker
    Tag               gophprofile.*
    Refresh_Interval  5
    Skip_Long_Lines   On
    # Database to save tracking state (persists across restarts)
    DB                /var/log/flb_state.db

[OUTPUT]
    Name            opensearch
    Match           gophprofile.*
    Host            opensearch
    Port            9200
    Index           gophprofile-logs
    Type            _doc
    # Default credentials for local dev environment
    HTTP_User       admin
    HTTP_Passwd     admin
    tls             Off
    # Replace dots in field names to avoid OpenSearch mapping issues
    Replace_Dots    On
