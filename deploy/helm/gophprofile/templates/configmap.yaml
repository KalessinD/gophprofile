apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.name" . }}-config
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
data:
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_USE_SSL: {{ .Values.s3.useSSL | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  KAFKA_TOPIC: {{ .Values.kafka.topic | quote }}
  KAFKA_GROUP_ID: {{ .Values.kafka.groupId | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
