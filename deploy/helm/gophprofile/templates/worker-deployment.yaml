apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.name" . }}-worker
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    component: worker
spec:
  {{- if not .Values.hpa.worker.enabled }}
    replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "gophprofile.name" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "gophprofile.name" . }}-worker
        component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ include "gophprofile.name" . }}-config
            - secretRef:
                name: {{ include "gophprofile.name" . }}-secret
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_DSN
              value: "postgres://gophprofile:secret@gophprofile-postgresql:5432/gophprofile?sslmode=disable"
            - name: S3_ENDPOINT
              value: "gophprofile-minio:9000"
            - name: S3_ACCESS_KEY
              value: "gk_server_access_key"
            - name: S3_SECRET_KEY
              value: "G0phK33p3rS3rv3r!"
            - name: S3_BUCKET
              value: "gophprofile"
            - name: KAFKA_BROKERS
              value: "gophprofile-kafka:9092"
            - name: KAFKA_TOPIC
              value: "avatar-processing"
            - name: KAFKA_GROUP_ID
              value: "gophprofile-worker-group"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4317"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
