apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gophprofile.name" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app: {{ include "gophprofile.name" . }}-otel-collector
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
