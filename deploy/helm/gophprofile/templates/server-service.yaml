apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.name" . }}-server
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.server.service.type "NodePort" }}
      nodePort: {{ .Values.server.service.nodePort }}
      {{- end }}
  selector:
    app: {{ include "gophprofile.name" . }}-server
