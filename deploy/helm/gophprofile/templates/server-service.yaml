apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.name" . }}-server
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    component: server
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "gophprofile.name" . }}-server
