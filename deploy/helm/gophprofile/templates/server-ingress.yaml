{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gophprofile.name" . }}-server
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    component: server
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gophprofile.name" . }}-server
                port:
                  number: 80
{{- end }}
