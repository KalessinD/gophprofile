# Infrastructure dependencies
postgresql:
  host: "gophprofile-postgresql"
  port: 5432
  username: "gophprofile"
  password: "" # should be filled in values.secret.yaml
  database: "gophprofile"

s3:
  endpoint: "gophprofile-minio:9000"
  bucket: "gophprofile"
  accessKey: "" # should be filled in values.secret.yaml
  secretKey: "" # should be filled in values.secret.yaml
  useSSL: "false"

kafka:
  brokers: "gophprofile-kafka:9092"
  topic: "avatar-processing"
  groupId: "gophprofile-worker-group"

otel:
  endpoint: "otel-collector:4317"

# Application settings
server:
  replicaCount: 1
  image:
    repository: gophprofile-server
    tag: local
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  replicaCount: 1
  image:
    repository: gophprofile-worker
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: true
  className: "traefik" # being used in Rancher Desktop by default
  host: "gophprofile.local"

# settings for HorizontalPodAutoscaler (HPA)
hpa:
  server:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: true
