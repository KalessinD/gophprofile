services:
  db:
    container_name: gophprofile-postgres
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gophprofile
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U gophprofile -d gophprofile"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/tmp/postgresql_gophprofile_data
      - ./migrations/000001_init_project.up.sql:/docker-entrypoint-initdb.d/000001_init_project.up.sql:ro
    networks:
      - gophprofile

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: gophprofile-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode settings (without Zookeeper)
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - gophprofile

  server:
    container_name: gophprofile-server
    build:
      context: ./docker/gophprofile-server
      additional_contexts:
        current: ./
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${GK_PORT:-8080}:8080"
    environment:
      DATABASE_DSN: postgres://gophprofile:secret@db:5432/gophprofile?sslmode=disable
      ADDRESS: 0.0.0.0:8080
      GODEBUG: netdns=go
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: gophprofile
      S3_USE_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: avatar-processing
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    networks:
      - gophprofile

  worker:
    container_name: gophprofile-worker
    build:
      context: ./docker/gophprofile-worker
      additional_contexts:
        current: ./
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://gophprofile:secret@db:5432/gophprofile?sslmode=disable
      GODEBUG: netdns=go
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: gophprofile
      S3_USE_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: avatar-processing
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    networks:
      - gophprofile

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: gophprofile-minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - /tmp/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gophprofile

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: gophprofile-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
    - -c
    - |
      set -e

      ACCESS_KEY="$${S3_ACCESS_KEY:-gk_server_access_key}"
      SECRET_KEY="$${S3_SECRET_KEY:-G0phK33p3rS3rv3r!}"

      mc alias set myminio http://minio:9000 minioadmin minioadmin

      mc mb myminio/gophprofile --ignore-existing

      mc admin user add myminio "$$ACCESS_KEY" "$$SECRET_KEY" || true

      cat <<'EOF' > /tmp/policy.json
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetBucketLocation",
              "s3:ListBucket"
            ],
            "Resource": [
              "arn:aws:s3:::gophprofile"
            ]
          },
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:PutObject",
              "s3:DeleteObject"
            ],
            "Resource": [
              "arn:aws:s3:::gophprofile/*"
            ]
          }
        ]
      }
      EOF

      mc admin policy create myminio gophprofile-policy /tmp/policy.json || \
        mc admin policy rm myminio gophprofile-policy && \
        mc admin policy create myminio gophprofile-policy /tmp/policy.json

      mc admin policy attach myminio gophprofile-policy --user "$$ACCESS_KEY"

      echo "S3 user and policy configured successfully"
    networks:
    - gophprofile

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: gophprofile-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - gophprofile

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: gophprofile-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_PERFORMANCE_ANALYZER=true
    ports:
      - "9200:9200"
      - "9600:9600" # Performance Analyzer
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - gophprofile

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: gophprofile-dashboards
    ports:
      - "5601:5601"
    environment:
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_DASHBOARDS_SECURITY_ENABLED=false
      - OPENSEARCH_HOSTS=http://opensearch:9200
    depends_on:
      - opensearch
    networks:
      - gophprofile

  dashboards-setup:
    image: curlimages/curl:8.21.0
    container_name: gophprofile-dashboards-setup
    depends_on:
      opensearch-dashboards:
        condition: service_started
    volumes:
      - ./docker/opensearch-dashboards/setup-data-view.sh:/setup.sh
    entrypoint: ["/bin/sh", "/setup.sh"]
    networks:
      - gophprofile

  fluent-bit:
    image: fluent/fluent-bit:5.1.1
    container_name: gophprofile-fluent-bit
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/containers:/var/log/containers:ro
      - ./docker/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./docker/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - fluent_bit_state:/var/log
    depends_on:
      - opensearch
    networks:
      - gophprofile

  prometheus:
    image: prom/prometheus:v3
    container_name: gophprofile-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - gophprofile

  grafana:
    image: grafana/grafana:13.0-slim
    container_name: gophprofile-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_PROVISIONING_PATH: /var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - opensearch
    networks:
      - gophprofile

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: gophprofile-kafka-exporter
    ports:
      - "9308:9308" # Default port for kafka-exporter
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_EXPORTER_PORT: "9308"
      KAFKA_LOG_DIR: /var/log/kafka-exporter
    volumes:
      - kafka_data:/var/log/kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - gophprofile

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: gophprofile-otel-collector
    command: ["--config=/etc/otel-collector/config.yaml"]
    ports:
      - "8889:8889" # Prometheus metrics endpoint
      - "13133:13133" # health check
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel-collector/config.yaml
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:13133']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - gophprofile

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: gophprofile-alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - gophprofile

volumes:
  postgres_data:
  kafka_data:
  opensearch_data:
  fluent_bit_state:
  prometheus_data:
  grafana_data:

networks:
  gophprofile:
    driver: bridge
